<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tyto Preview</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(ellipse at 60% 20%, #1e1b4b 0%, #0f172a 60%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #f1f5f9;
    }
    .card {
      text-align: center;
      padding: 3.5rem 3rem;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 28px;
      backdrop-filter: blur(16px);
      max-width: 500px;
      width: 92%;
      box-shadow: 0 32px 64px rgba(0,0,0,0.4);
    }
    .nest-icon { font-size: 3.5rem; margin-bottom: 1.25rem; }
    h1 {
      font-size: 2.6rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      background: linear-gradient(135deg, #c4b5fd 0%, #818cf8 50%, #38bdf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.4rem;
    }
    .tagline {
      font-size: 1rem;
      color: rgba(241,245,249,0.45);
      margin-bottom: 2rem;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(74,222,128,0.12);
      border: 1px solid rgba(74,222,128,0.3);
      color: #4ade80;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 0.3rem 0.85rem;
      border-radius: 999px;
      margin-bottom: 2.25rem;
    }
    .dot {
      width: 7px; height: 7px;
      background: #4ade80;
      border-radius: 50%;
      animation: pulse 1.8s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.5;transform:scale(.85)} }
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.75rem;
      margin-bottom: 2rem;
    }
    .stat {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 14px;
      padding: 1rem 0.5rem;
    }
    .stat-value { font-size: 1.4rem; font-weight: 700; color: #93c5fd; }
    .stat-label { font-size: 0.7rem; color: rgba(241,245,249,0.35); margin-top: 3px; letter-spacing: 0.05em; text-transform: uppercase; }
    .footer { font-size: 0.8rem; color: rgba(241,245,249,0.25); }
    .footer strong { color: rgba(241,245,249,0.5); }
  </style>
</head>
<body>
  <div class="card">
    <div class="nest-icon">🪺</div>
    <h1>Hello from Tyto</h1>
    <p class="tagline">Your nest is live and serving this page</p>
    <div class="badge"><span class="dot"></span> Live Preview</div>
    <div class="stats">
      <div class="stat">
        <div class="stat-value">1</div>
        <div class="stat-label">Nest</div>
      </div>
      <div class="stat">
        <div class="stat-value">3000</div>
        <div class="stat-label">Port</div>
      </div>
      <div class="stat">
        <div class="stat-value">✓</div>
        <div class="stat-label">Online</div>
      </div>
    </div>
    <p class="footer">Served by <strong>@bonya/tyto</strong> SDK</p>
  </div>
</body>
</html>
